<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dr. Evie's Animal Clinic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#ffd9e8;background-image:radial-gradient(#ffffff88 12%,transparent 13%);background-size:44px 44px;
  font-family:"Arial Rounded MT Bold","Varela Round","Nunito","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  color:#5a3d6b;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;transform-origin:0 0;overflow:hidden;background:#fff6fa;box-shadow:0 0 40px rgba(120,60,100,.25)}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:none;overflow:hidden}
.screen.active{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.abs{position:absolute}
.hidden{display:none!important}
svg{display:block}
button{font:inherit;color:inherit;border:none;padding:0;margin:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* ---------- buttons ---------- */
.icon-btn{position:absolute;width:76px;height:76px;border-radius:50%;background:#b79cff;box-shadow:0 7px 0 #8a6fd6,0 12px 20px rgba(60,20,80,.18);padding:16px;z-index:30;transition:transform .08s}
.icon-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #8a6fd6}
.icon-btn svg{width:100%;height:100%}
#mute{top:14px;right:14px;z-index:60;background:#7cc6fe;box-shadow:0 7px 0 #4a98d4,0 12px 20px rgba(0,0,0,.15)}
#mute:active{box-shadow:0 2px 0 #4a98d4}
.big-play{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc2d8,#ff6fa0 70%);
  box-shadow:0 10px 0 #d94f80,0 18px 30px rgba(120,20,60,.25);padding:36px 30px 36px 42px;z-index:25;animation:pulse 1.4s ease-in-out infinite}
.big-play svg{width:100%;height:100%}
.big-play:active{box-shadow:0 3px 0 #d94f80}
.big-play.replay{padding:32px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pop-in{animation:popIn .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- top bar ---------- */
.topbar{position:absolute;left:0;top:0;width:100%;height:100px;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
.prog{position:absolute;left:16px;top:20px;display:flex;gap:8px}
.prog.withhome{left:108px}
.pdot{width:56px;height:56px;border-radius:50%;background:#fff;border:5px solid #ffd0e0;padding:7px;opacity:.75;transition:transform .3s}
.pdot svg{width:100%;height:100%}
.pdot.done{background:#ffe066;border-color:#ffb800;opacity:1}
.pdot.cur{transform:scale(1.18);opacity:1;border-color:#ff6fa0}
.pdot.gold{border-color:#e0a800}
.tr{position:absolute;right:104px;top:18px;display:flex;gap:12px;align-items:center}
.pill{height:68px;padding:0 24px 0 12px;border-radius:34px;background:#fff;display:flex;align-items:center;gap:6px;font-size:40px;color:#e39a00;box-shadow:0 6px 0 #ffd36b,0 10px 16px rgba(0,0,0,.1)}
.pill svg{width:50px;height:50px}
.pill b{min-width:30px;display:inline-block}
.pill.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.bookic{width:72px;height:72px;border-radius:20px;background:#fff;padding:8px;box-shadow:0 6px 0 #ffb3cd,0 10px 16px rgba(0,0,0,.1)}
.bookic svg{width:100%;height:100%}
.bookic.bump{animation:bump .4s}

/* ---------- animals ---------- */
.pt{position:absolute}
.pt .mv,.pt .md,.pt .rx{width:100%;height:100%}
.pt .md,.pt .rx{transform-origin:50% 95%}
.pt svg{width:100%;height:100%;overflow:visible}
.md.sad{animation:sadW 1.8s ease-in-out infinite}
.md.shiver{animation:shiver .14s linear infinite}
.md.droopy{animation:droop 2.6s ease-in-out infinite}
.md.dance{animation:dance .75s ease-in-out infinite}
.md.idle{animation:idleB 2.2s ease-in-out infinite}
.md.walk{animation:walk .34s ease-in-out infinite}
.rx.giggle{animation:giggle .7s}
.rx.sneeze{animation:sneeze .75s}
.rx.boing{animation:boing .75s}
.rx.hop{animation:hop .42s}
@keyframes sadW{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes shiver{0%,100%{transform:translateX(-1.2%)}50%{transform:translateX(1.2%)}}
@keyframes droop{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.03,.95) rotate(-3deg)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12%) rotate(-8deg)}50%{transform:translateY(0) scale(1.06,.94)}75%{transform:translateY(-12%) rotate(8deg)}}
@keyframes idleB{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10%) rotate(5deg)}}
@keyframes giggle{0%,100%{transform:scale(1)}20%{transform:scale(1.08,.92)}40%{transform:scale(.94,1.06) rotate(-5deg)}60%{transform:scale(1.07,.93) rotate(5deg)}80%{transform:scale(.97,1.03)}}
@keyframes sneeze{0%{transform:rotate(0)}30%{transform:rotate(-10deg) translateX(-4%)}45%{transform:rotate(10deg) translateX(5%) scale(1.06)}70%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@keyframes boing{0%{transform:translateY(0) scale(1)}15%{transform:scale(1.12,.85)}45%{transform:translateY(-30%) scale(.92,1.1)}75%{transform:translateY(0) scale(1.12,.88)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}

/* ---------- room ---------- */
.room{position:absolute;left:0;top:0;width:100%;height:100%}
.room .wall{position:absolute;left:0;top:0;width:100%;background:#fde7ef;background-image:radial-gradient(#ffd3e2 14%,transparent 15%);background-size:60px 60px}
.room .wains{position:absolute;left:0;width:100%;background:repeating-linear-gradient(90deg,#ffc9dc 0 34px,#ffd6e5 34px 68px);border-top:8px solid #fff}
.room .floor{position:absolute;left:0;bottom:0;width:100%;background:#f3d3a3;background-image:repeating-linear-gradient(90deg,transparent 0 118px,#e2bb86 118px 122px),repeating-linear-gradient(0deg,#f3d3a3 0 58px,#ecc795 58px 62px)}
.deco svg{width:100%;height:100%;overflow:visible}
.deco.tap{animation:boing2 .6s}
.deco.shake{animation:shake2 .4s}
.deco.floaty{animation:floaty 1.4s ease-in-out}
@keyframes boing2{0%,100%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}}
@keyframes shake2{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
.flower{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.bloom .flower{transform:scale(1)}
.chair{position:absolute}
.chair svg{width:100%;height:100%}
.wp .glow{position:absolute;left:5%;width:90%;bottom:-6%;height:18%;border-radius:50%;background:radial-gradient(#fff59d,#ffe06600 70%);display:none}
.wp.next .glow{display:block;animation:pulse 1s infinite}
.wp .arrow{position:absolute;left:50%;margin-left:-30px;top:-70px;width:60px;height:60px;display:none;animation:arrowB .8s ease-in-out infinite}
.wp.next .arrow{display:block}
@keyframes arrowB{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
.wp .check{position:absolute;right:-4%;top:-4%;width:38%;height:38%}
.wp .check .stk{width:100%;height:100%;border-width:4px}

/* ---------- exam ---------- */
.exam-bg .wall{position:absolute;left:0;top:0;width:100%;background:#e3f4ff;background-image:radial-gradient(#cfeaff 14%,transparent 15%);background-size:56px 56px}
.exam-bg .floor{position:absolute;left:0;bottom:0;width:100%;background-color:#c9f2e2;background-image:linear-gradient(45deg,#b3ead5 25%,transparent 25%,transparent 75%,#b3ead5 75%),linear-gradient(45deg,#b3ead5 25%,transparent 25%,transparent 75%,#b3ead5 75%);background-size:80px 80px;background-position:0 0,40px 40px}
.exam-bg .stripe{position:absolute;left:0;width:100%;height:30px;background:#9fd6ff;border-top:6px solid #fff}
.table svg,.exd svg{width:100%;height:100%}
.tray{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(#fff6de,#ffe3a6);border-top:8px solid #ffc861;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px;padding:16px 20px;z-index:10;transition:transform .5s}
.tray.off{transform:translateY(110%)}
.tool{width:var(--ts);height:var(--ts);border-radius:26%;background:#fff;box-shadow:0 7px 0 #f0c27a,0 10px 16px rgba(0,0,0,.12);padding:calc(var(--ts) * .1);touch-action:none;cursor:grab;position:relative}
.tool svg{width:100%;height:100%;pointer-events:none}
.tool.dragging{opacity:.3}
.bubble{position:absolute;background:#fff;border-radius:44px;border:7px solid #ffb3cd;box-shadow:0 10px 24px rgba(120,40,80,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 12px;z-index:9;transform-origin:10% 90%;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both}
.bubble .ic{width:130px;height:130px}
.bubble .ic svg{width:100%;height:100%;overflow:visible}
.bubble .w{font-size:42px;color:#ff5d8f;line-height:1;white-space:nowrap}
.bubble .t1,.bubble .t2{position:absolute;background:#fff;border:6px solid #ffb3cd;border-radius:50%}
.bubble.side .t1{width:34px;height:34px;left:-30px;bottom:30px}
.bubble.side .t2{width:20px;height:20px;left:-54px;bottom:12px}
.bubble.top .t1{width:34px;height:34px;left:50%;margin-left:-17px;bottom:-40px}
.bubble.top .t2{width:20px;height:20px;left:50%;margin-left:-30px;bottom:-66px}
.bubble.out{animation:popOut .3s forwards}
@keyframes popOut{to{transform:scale(0);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.ghost.fly{transition:left .35s ease,top .35s ease,opacity .3s}
.ghost .gi{width:100%;height:100%}
.ghost svg{width:100%;height:100%}
.gi.u-pull{animation:uPull .45s ease-in-out 2}
.gi.u-rub{animation:uRub .3s ease-in-out 3}
.gi.u-press{animation:uPress .3s ease-in-out 3}
.gi.u-tilt{animation:uTilt .45s ease-in-out 2 alternate}
.gi.u-spray{animation:uSpray .1s linear 8}
.gi.u-bounce{animation:uBounce .32s ease-in-out 3}
.gi.u-nom{animation:uNom .9s forwards}
.gi.u-listen{animation:uPress .55s ease-in-out 3}
@keyframes uPull{0%,100%{transform:translateY(0)}50%{transform:translateY(-35%) rotate(-8deg)}}
@keyframes uRub{0%,100%{transform:translateX(0)}25%{transform:translateX(-25%) rotate(-10deg)}75%{transform:translateX(25%) rotate(10deg)}}
@keyframes uPress{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes uTilt{from{transform:rotate(0)}to{transform:rotate(-40deg)}}
@keyframes uSpray{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes uBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-45%)}}
@keyframes uNom{0%{transform:scale(1)}33%{transform:scale(.75)}66%{transform:scale(.45)}100%{transform:scale(.1);opacity:0}}
.banner{position:absolute;left:0;width:100%;text-align:center;font-size:96px;color:#ff5d8f;z-index:40;pointer-events:none;line-height:1.1;
  text-shadow:5px 5px 0 #fff,-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,0 6px 0 #fff,6px 0 0 #fff,-6px 0 0 #fff,0 -6px 0 #fff,0 14px 10px rgba(0,0,0,.15);
  animation:bannerIn .7s cubic-bezier(.3,1.6,.5,1) both}
.banner.out{animation:popOut .35s forwards}
@keyframes bannerIn{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1) rotate(0)}}
.say{position:absolute;z-index:30;font-size:44px;color:#7a5cff;background:#fff;border-radius:34px;padding:6px 22px;box-shadow:0 6px 16px rgba(0,0,0,.15);white-space:nowrap;pointer-events:none;animation:sayPop 1.3s forwards}
@keyframes sayPop{0%{transform:scale(0)}15%{transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.flyer{position:absolute;z-index:45;pointer-events:none}
.flyer svg{width:100%;height:100%}

/* ---------- stickers ---------- */
.stk{border-radius:50%;border:6px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.18);overflow:hidden;position:relative}
.stk svg{width:88%;height:88%;margin:6%;overflow:visible}
.stk.gold{border-color:#ffd54a;box-shadow:0 0 0 4px #e0a800,0 0 22px 4px #ffe066}
.stk.sis{border-color:#e3ccff;box-shadow:0 0 0 4px #a77be8,0 0 20px 4px #e2ccff}
.stk.gold:after,.stk.sis:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 30%,#ffffffaa 45%,transparent 60%);background-size:300% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-150% 0}}

/* ---------- title ---------- */
.sky{position:absolute;inset:0;background:linear-gradient(#9fdcff,#d8f2ff 70%)}
.grass{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(#8fdc7a,#6cc65a);border-top:10px solid #a6e98f}
.sun{width:130px;height:130px;border-radius:50%;background:radial-gradient(#fff6a8,#ffd54a 65%);box-shadow:0 0 0 18px #ffe98a66,0 0 0 40px #ffe98a33;animation:spinS 20s linear infinite}
@keyframes spinS{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:180px;height:60px;background:#fff;border-radius:40px;opacity:.95;animation:drift 40s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:80px;height:80px;left:24px;top:-40px}
.cloud:after{width:60px;height:60px;left:90px;top:-28px}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2000px)}}
.bld{transform-origin:0 0;width:560px;height:560px}
.bld>svg{width:100%;height:100%;overflow:visible}
.sign-t{position:absolute;left:30px;top:12px;width:500px;height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sign-t .t1{font-size:60px;color:#ff5d8f}
.sign-t .t2{font-size:46px;color:#8a63e0;margin-top:6px}
.gear{left:16px;bottom:16px;top:auto;width:70px;height:70px;padding:12px;background:#c9b8ff;box-shadow:0 6px 0 #9a83e0,0 10px 16px rgba(0,0,0,.12)}
.modal .srow2{display:flex;gap:16px;justify-content:center;margin-bottom:22px}
.modal .srow2 button{display:flex;align-items:center;gap:10px;margin:0}
.modal .srow2 svg{width:36px;height:36px}
.modal .snd{background:#7cc6fe;color:#fff}
.lbl-btn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30}
.lbl-btn .icon-btn{position:relative;width:100px;height:100px;padding:20px}
.lbl-btn span{font-size:30px;color:#fff;text-shadow:0 3px 0 #8a6fd6,2px 0 0 #8a6fd6,-2px 0 0 #8a6fd6,0 -2px 0 #8a6fd6}

/* ---------- panels / overlays ---------- */
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
.panel{background:#fffdf6;border-radius:48px;border:10px solid #ffc2d8;box-shadow:0 20px 50px rgba(120,40,80,.25);padding:28px 30px 32px;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:calc(100% - 40px)}
.ptitle{font-size:64px;color:#ff5d8f;text-align:center;line-height:1.05}
.srow{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.srow .stk{width:104px;height:104px}
.starsrow{display:flex;align-items:center;gap:8px;font-size:52px;color:#e39a00}
.starsrow svg{width:64px;height:64px}
.newrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.newlbl{font-size:44px;color:#fff;background:#8ee3a0;border-radius:30px;padding:4px 22px;transform:rotate(-6deg);box-shadow:0 5px 0 #5cbf72}
.newdeco{width:130px;height:110px;background:#fff1f6;border-radius:20px;padding:8px;box-shadow:inset 0 0 0 4px #ffd0e0}
.newdeco svg{width:100%;height:100%}
.btns{display:flex;gap:40px;align-items:center}
.btns .big-play,.btns .icon-btn{position:relative}
.btns .icon-btn{width:110px;height:110px;padding:22px}
.overlay{position:absolute;inset:0;background:rgba(90,40,90,.45);z-index:55;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
.book{background:#fff8fb;border-radius:40px;border:12px solid #ff9cc0;padding:20px 24px 28px;width:min(940px,calc(100% - 40px));max-height:calc(100% - 50px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
.bhead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.bhead .bk{width:70px;height:70px}
.bhead .pill{box-shadow:0 5px 0 #ffd36b}
.bhead .x{margin-left:auto;width:76px;height:76px;position:relative;background:#ff8fb1;box-shadow:0 7px 0 #d94f80}
.bgrid{touch-action:pan-y;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px;overflow:auto;padding:10px 6px;justify-items:center}
.bslot{position:relative;width:130px;height:130px}
.bslot .stk{width:100%;height:100%}
.bslot.empty .stk{background:#eee!important;border-style:dashed;border-color:#ddd;box-shadow:none}
.bslot.empty svg{filter:brightness(0);opacity:.15}
.bslot .cnt{position:absolute;right:-6px;bottom:-6px;background:#ff6fa0;color:#fff;border-radius:20px;font-size:28px;padding:2px 12px;border:4px solid #fff}
.bslot.hopit{animation:hop .45s}
.modal{background:#fff;border-radius:30px;padding:30px 36px;text-align:center;font-family:system-ui,sans-serif;color:#444;box-shadow:0 20px 50px rgba(0,0,0,.3);max-width:560px}
.modal h2{margin:0 0 10px;font-size:34px}
.modal p{margin:0 0 24px;font-size:24px}
.modal button{font-size:28px;padding:14px 30px;border-radius:18px;margin:0 10px;background:#eee}
.modal button.danger{background:#ff4d6d;color:#fff}
.bookbtn{position:absolute;width:130px;height:130px;border-radius:30px;background:#fff;padding:14px;box-shadow:0 8px 0 #ffb3cd,0 14px 20px rgba(0,0,0,.15);z-index:30;animation:pulse 2.4s ease-in-out infinite}
.bookbtn svg{width:100%;height:100%}
.bookbtn.shopbtn{box-shadow:0 8px 0 #ffd166,0 14px 20px rgba(0,0,0,.15);animation-delay:-1.2s}
.icon-btn.yellow{background:#ffc94d;box-shadow:0 7px 0 #e0a020,0 12px 20px rgba(60,20,80,.18)}
/* ---------- walking pets ---------- */
.petlayer{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none}
.petlayer .pet{pointer-events:auto}
.pet .flip{width:100%;height:100%;transition:transform .25s}
.pet .flip.left{transform:scaleX(-1)}
/* ---------- shop ---------- */
.shop-bg{position:absolute;inset:0;background:#fff4e0;background-image:radial-gradient(#ffe6b8 14%,transparent 15%);background-size:56px 56px}
.awning{position:absolute;left:0;top:0;width:100%;height:118px;background:repeating-linear-gradient(90deg,#ff8fb1 0 70px,#fff 70px 140px);z-index:2}
.awning:after{content:"";position:absolute;left:0;bottom:-30px;width:100%;height:30px;background:radial-gradient(circle at 35px 0,#ff8fb1 29px,transparent 30px),radial-gradient(circle at 105px 0,#fff 29px,transparent 30px);background-size:140px 30px}
.shop-sign{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#fff;border:8px solid #ffd166;border-radius:30px;padding:2px 40px 6px;font-size:58px;color:#ff5d8f;z-index:21;box-shadow:0 8px 16px rgba(0,0,0,.12);white-space:nowrap}
.tabs{position:absolute;left:0;width:100%;top:168px;display:flex;justify-content:center;gap:30px;z-index:5}
.tab{width:100px;height:100px;border-radius:50%;background:#fff;padding:20px;box-shadow:0 6px 0 #e7c9a0;opacity:.6;transition:transform .2s}
.tab svg{width:100%;height:100%}
.tab.on{opacity:1;transform:scale(1.15);box-shadow:0 0 0 6px #ff8fb1,0 6px 0 #e7c9a0}
.sgrid{position:absolute;left:20px;right:20px;top:300px;bottom:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:186px;gap:16px;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:8px 8px 20px;z-index:5}

<body>
<div id="stage">
  <div class="screen" id="s-title"></div>
  <div class="screen" id="s-wait"></div>
  <div class="screen" id="s-exam"></div>
  <div class="screen" id="s-closed"></div>
  <div class="screen" id="s-room"></div>
  <div class="screen" id="s-shop"></div>
  <button class="icon-btn" id="mute" aria-label="Sound on or off"></button>
</div>
<canvas id="fx"></canvas>
<script>
'use strict';
/* =====================================================================
   Dr. Evie's Animal Clinic — everything (art + sound) is made in code.
   ===================================================================== */

// ---------- small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
// Every screen change bumps `gen`; async sequences stop when it changes.
let gen = 0; const ABORT = { abort: true };
async function wait(ms, g) { await sleep(ms); if (g !== gen) throw ABORT; }
function run(fn) { fn().catch(e => { if (e !== ABORT) console.error(e); }); }

// ---------- saving ----------
const SAVE_KEY = 'drEvieClinic.v3';
// stars = stars to spend in the shop; owned = bought decorations; pets = bought pets
const freshSave = muted => ({ v: 2, stars: 0, stickers: {}, muted: !!muted, days: 0, owned: {}, pets: [], photos: [], petLove: {} });
let save = freshSave(false);
function load() {
  let s = null; try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (s && typeof s === 'object') {
    // v1 unlocked decorations by star total; keep everything she already had
    if (!s.v) { s.owned = {}; DECOS.forEach(d => { if ((s.stars || 0) >= d.cost) s.owned[d.id] = true; }); s.pets = []; s.v = 2; }
    save = Object.assign(save, s);
  }
  if (!save.stickers || typeof save.stickers !== 'object') save.stickers = {};
  if (!save.owned || typeof save.owned !== 'object') save.owned = {};
  if (!Array.isArray(save.pets)) save.pets = [];
  if (!Array.isArray(save.photos)) save.photos = [];
  if (!save.petLove || typeof save.petLove !== 'object') save.petLove = {};
}
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* =====================================================================
   SOUND — Web Audio synthesis, no files.
   ===================================================================== */
const Snd = {
  ctx: null, master: null, sfx: null, music: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(c.destination);
    this.master = c.createGain(); this.master.gain.value = save.muted ? 0 : 0.9; this.master.connect(comp);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    this.music = c.createGain(); this.music.gain.value = 0.16; this.music.connect(this.master);
    const len = c.sampleRate; const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    // tiny silent blip unlocks iOS
    const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
  },
  setMuted(m) { save.muted = m; store(); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05); drawMute(); }
};
function env(p, t0, v, a, hold, d) {
  p.setValueAtTime(0.0001, t0); p.exponentialRampToValueAtTime(v, t0 + a);
  if (hold) p.setValueAtTime(v, t0 + a + hold);
  p.exponentialRampToValueAtTime(0.0001, t0 + d);
}
function filt(src, o, t0) {
  const f = Snd.ctx.createBiquadFilter(); f.type = o.filt[0]; f.frequency.setValueAtTime(o.filt[1], t0); f.Q.value = o.filt[2] || 1;
  if (o.fpts) for (const [tt, ff] of o.fpts) f.frequency.exponentialRampToValueAtTime(ff, t0 + tt);
  src.connect(f); return f;
}
function tone(o) {
  const c = Snd.ctx; if (!c) return;
  const t0 = o.t != null ? o.t : c.currentTime + 0.01 + (o.at || 0), d = o.dur;
  const osc = c.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if (o.pts) for (const [tt, ff] of o.pts) osc.frequency.exponentialRampToValueAtTime(ff, t0 + tt);
  const g = c.createGain(); env(g.gain, t0, o.vol == null ? 0.3 : o.vol, o.a || 0.01, o.hold || 0, d);
  if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + d + 0.1); }
  let n = osc; if (o.filt) n = filt(osc, o, t0);
  n.connect(g); g.connect(o.bus || Snd.sfx); osc.start(t0); osc.stop(t0 + d + 0.1);
}
function nz(o) {
  const c = Snd.ctx; if (!c) return;
  const t0 = c.currentTime + 0.01 + (o.at || 0);
  const s = c.createBufferSource(); s.buffer = Snd.noise; s.loop = true;
  const g = c.createGain(); env(g.gain, t0, o.vol || 0.2, o.a || 0.005, o.hold || 0, o.dur);
  let n = s; if (o.filt) n = filt(s, o, t0);
  n.connect(g); g.connect(Snd.sfx); s.start(t0, Math.random() * 0.5); s.stop(t0 + o.dur + 0.1);
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const SFX = {
  bark(p = 1, n = 2) {
    for (let i = 0; i < n; i++) {
      const at = i * 0.24;
      tone({ type: 'sawtooth', f: 380 * p, pts: [[0.035, 560 * p], [0.16, 240 * p]], dur: 0.18, vol: 0.3, filt: ['bandpass', 1000 * p, 1.6], at });
      tone({ type: 'square', f: 190 * p, pts: [[0.03, 280 * p], [0.15, 120 * p]], dur: 0.16, vol: 0.1, filt: ['lowpass', 900 * p, 1], at });
      nz({ dur: 0.06, vol: 0.12, filt: ['bandpass', 1500 * p, 1], at });
    }
  },
  meow(p = 1, trill) {
    tone({ type: 'sawtooth', f: 480 * p, pts: [[0.12, 780 * p], [0.38, 640 * p], [0.62, 430 * p]], dur: 0.66, vol: 0.22, a: 0.05, hold: 0.3, vib: [6, 10 * p], filt: ['bandpass', 900 * p, 2.5], fpts: [[0.15, 2200 * p], [0.6, 800 * p]] });
    if (trill) tone({ type: 'triangle', f: 600, pts: [[0.12, 820]], dur: 0.2, vol: 0.12, vib: [28, 40], at: 0.72 });
  },
  squeak(p = 1) { for (let i = 0; i < 3; i++) tone({ f: 1700 * p, pts: [[0.06, 2600 * p]], dur: 0.08, vol: 0.18, at: i * 0.11 }); },
  bunny() { nz({ dur: 0.05, vol: 0.1, filt: ['highpass', 4000, 1], at: 0 }); nz({ dur: 0.05, vol: 0.1, filt: ['highpass', 4000, 1], at: 0.1 }); tone({ f: 1500, pts: [[0.1, 2200]], dur: 0.12, vol: 0.18, at: 0.25 }); tone({ f: 1700, pts: [[0.1, 2400]], dur: 0.1, vol: 0.14, at: 0.4 }); },
  turtle() { tone({ f: 260, pts: [[0.12, 520]], dur: 0.16, vol: 0.3 }); tone({ f: 340, pts: [[0.12, 640]], dur: 0.16, vol: 0.3, at: 0.2 }); },
  chirp() {
    for (let i = 0; i < 3; i++) tone({ f: 2200, pts: [[0.05, 3500], [0.1, 2500]], dur: 0.11, vol: 0.16, at: i * 0.13 });

  },
  neigh(p = 1) {
    tone({ type: 'sawtooth', f: 700 * p, pts: [[0.12, 950 * p], [0.95, 380 * p]], dur: 1.0, vol: 0.2, a: 0.04, hold: 0.4, vib: [14, 70 * p], filt: ['bandpass', 1300 * p, 1.4] });
    nz({ dur: 0.3, vol: 0.12, filt: ['lowpass', 900, 1], at: 1.0 });
  },
  oink() { for (const at of [0, 0.26]) { tone({ type: 'sawtooth', f: 170, pts: [[0.06, 260], [0.18, 140]], dur: 0.2, vol: 0.32, filt: ['bandpass', 700, 3], at }); nz({ dur: 0.18, vol: 0.12, filt: ['lowpass', 700, 1], at }); } },
  sparkle() { const ns = shuffle([84, 88, 91, 93, 96, 100, 103]); for (let i = 0; i < 6; i++) { tone({ f: mf(ns[i]), dur: 0.35, vol: 0.09, at: i * 0.055 }); tone({ type: 'triangle', f: mf(ns[i] + 12), dur: 0.2, vol: 0.03, at: i * 0.055 }); } },
  boing() { tone({ f: 160, pts: [[0.45, 480]], vib: [14, 50], dur: 0.5, vol: 0.26 }); },
  pop() { tone({ f: 800, pts: [[0.09, 180]], dur: 0.1, vol: 0.32 }); nz({ dur: 0.03, vol: 0.1, filt: ['highpass', 2000, 1] }); },
  cheer() {
    nz({ dur: 1.4, vol: 0.14, a: 0.15, hold: 0.5, filt: ['bandpass', 1800, 0.6] });
    [72, 76, 79, 84].forEach((m, i) => tone({ type: 'triangle', f: mf(m), dur: 0.45, vol: 0.16, at: i * 0.09 }));
    [84, 88, 91].forEach(m => tone({ type: 'triangle', f: mf(m), dur: 0.8, vol: 0.09, at: 0.4 }));
    tone({ type: 'sawtooth', f: 420, pts: [[0.15, 700], [0.5, 600]], dur: 0.55, vol: 0.08, filt: ['bandpass', 1200, 2], at: 0.1 });
  },
  giggle() { for (let i = 0; i < 5; i++) tone({ type: 'triangle', f: 1000 - i * 60, vib: [28, 60], dur: 0.085, vol: 0.2, at: i * 0.11 }); },
  sneeze() {
    tone({ f: 300, pts: [[0.32, 620]], dur: 0.35, vol: 0.12, a: 0.2 });
    nz({ dur: 0.3, vol: 0.4, filt: ['bandpass', 2800, 0.8], at: 0.38 });
    tone({ type: 'sawtooth', f: 700, pts: [[0.2, 200]], dur: 0.2, vol: 0.08, filt: ['lowpass', 2000, 1], at: 0.38 });
  },
  nom() { for (let i = 0; i < 3; i++) { nz({ dur: 0.07, vol: 0.32, filt: ['bandpass', 1600, 1.2], at: i * 0.16 }); tone({ type: 'square', f: 160, pts: [[0.06, 90]], dur: 0.06, vol: 0.06, at: i * 0.16 }); } },
  honk() { tone({ type: 'sawtooth', f: 260, pts: [[0.35, 190]], dur: 0.38, vol: 0.22, vib: [22, 12], filt: ['lowpass', 1000, 4] }); nz({ dur: 0.35, vol: 0.14, filt: ['lowpass', 700, 1] }); },
  spray() { nz({ dur: 0.35, vol: 0.2, a: 0.02, hold: 0.15, filt: ['highpass', 2500, 1] }); nz({ dur: 0.35, vol: 0.2, a: 0.02, hold: 0.15, filt: ['highpass', 2500, 1], at: 0.45 }); },
  slap() { nz({ dur: 0.08, vol: 0.45, filt: ['lowpass', 1400, 1] }); tone({ f: 600, pts: [[0.08, 300]], dur: 0.09, vol: 0.15 }); },
  clink() { [2600, 3100, 2200].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.14, vol: 0.12, at: i * 0.08 })); nz({ dur: 0.12, vol: 0.05, filt: ['highpass', 5000, 1] }); },
  gulp() { tone({ f: 500, pts: [[0.14, 160]], dur: 0.15, vol: 0.32 }); tone({ f: 450, pts: [[0.14, 140]], dur: 0.15, vol: 0.3, at: 0.22 }); },
  beep() { [0, 0.18, 0.36].forEach(at => tone({ type: 'square', f: 2000, dur: 0.07, vol: 0.06, at })); tone({ type: 'square', f: 2600, dur: 0.28, vol: 0.06, a: 0.01, hold: 0.15, at: 0.6 }); },
  heartbeat() { for (const k of [0, 0.6]) for (const at of [k, k + 0.2]) { tone({ f: 95, pts: [[0.12, 60]], dur: 0.14, vol: 0.7, at }); tone({ f: 160, pts: [[0.1, 100]], dur: 0.12, vol: 0.3, at }); } },
  aww() { tone({ f: 760, pts: [[0.55, 520]], dur: 0.6, vol: 0.18, a: 0.06, vib: [5, 10] }); tone({ f: 1140, pts: [[0.55, 780]], dur: 0.6, vol: 0.05, a: 0.06 }); },
  whoosh() { nz({ dur: 0.55, vol: 0.28, a: 0.2, filt: ['bandpass', 400, 0.9], fpts: [[0.45, 2400]] }); },
  squeakToy() { tone({ f: 1100, pts: [[0.13, 1700]], dur: 0.14, vib: [30, 40], vol: 0.2 }); tone({ f: 1700, pts: [[0.15, 1100]], dur: 0.16, vib: [30, 40], vol: 0.2, at: 0.22 }); },
  chime() { tone({ f: 1320, dur: 0.3, vol: 0.1 }); tone({ f: 1760, dur: 0.35, vol: 0.09, at: 0.09 }); },
  boop() { tone({ f: 320, pts: [[0.15, 240]], dur: 0.17, vol: 0.2 }); },
  bubbles() { for (let i = 0; i < 5; i++) tone({ f: rand(350, 500), pts: [[0.06, rand(800, 1100)]], dur: 0.07, vol: 0.14, at: i * 0.09 + rand(0, 0.04) }); },
  fanfare() { [[72, 0, .15], [76, .15, .15], [79, .3, .15], [84, .45, .35], [79, .85, .15], [84, 1.0, .7]].forEach(([m, at, d]) => { tone({ type: 'triangle', f: mf(m), dur: d + 0.1, vol: 0.18, at }); tone({ type: 'square', f: mf(m - 12), dur: d, vol: 0.04, at, filt: ['lowpass', 1500, 1] }); }); },
  tweeze() { this.pop(); tone({ f: 2400, dur: 0.25, vol: 0.08, at: 0.12 }); },
  baa() { tone({ type: 'sawtooth', f: 420, pts: [[0.1, 470], [0.7, 380]], dur: 0.75, vol: 0.2, a: 0.04, hold: 0.4, vib: [9, 40], filt: ['bandpass', 1100, 2] }); },
  peep() { for (let i = 0; i < 3; i++) tone({ f: 2600, pts: [[0.05, 3300], [0.09, 2900]], dur: 0.1, vol: 0.15, at: i * 0.16 }); },
  wheek() { for (const at of [0, 0.34]) tone({ f: 1100, pts: [[0.25, 2600]], dur: 0.28, vol: 0.17, vib: [20, 40], at }); },
  penguin() { tone({ type: 'sawtooth', f: 500, pts: [[0.15, 720], [0.4, 560]], dur: 0.45, vol: 0.17, vib: [18, 30], filt: ['bandpass', 1200, 3] }); tone({ type: 'sawtooth', f: 560, pts: [[0.12, 760]], dur: 0.25, vol: 0.15, vib: [18, 30], filt: ['bandpass', 1200, 3], at: 0.5 }); },
  shiloh() {
    tone({ type: 'triangle', f: 520, pts: [[0.18, 720]], dur: 0.22, vol: 0.16, vib: [6, 8] });
    tone({ type: 'sawtooth', f: 520, pts: [[0.18, 720]], dur: 0.22, vol: 0.05, filt: ['bandpass', 2300, 3] });

  mel: [76, 0, 79, 0, 84, 0, 79, 76, 77, 0, 81, 0, 84, 0, 81, 77, 79, 81, 83, 0, 86, 0, 83, 79, 84, 0, 79, 0, 76, 74, 72, 0,

  bass: [48, 41, 43, 48, 45, 41, 43, 48],
  chords: [[60, 64, 67], [60, 65, 69], [59, 62, 67], [60, 64, 67], [60, 64, 69], [60, 65, 69], [59, 62, 67], [60, 64, 67]],
  start() { if (!Snd.ctx || this.on) return; this.on = true; this.next = Snd.ctx.currentTime + 0.15; this.timer = setInterval(() => this.tick(), 40); },
  tick() {
    const c = Snd.ctx; if (!c || c.state !== 'running') return;
    const spb = 60 / 116 / 2;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.2) { this.play(this.step, this.next, spb); this.next += spb; this.step = (this.step + 1) % 64; }
  },

    const bar = Math.floor(s / 8), m = this.mel[s];

    if (s % 4 === 0) { const b = this.bass[bar] + (s % 8 === 4 ? 7 : 0); tone({ f: mf(b), dur: spb * 1.8, vol: 0.55, t, bus: Snd.music }); }
    if (s % 4 === 2) this.chords[bar].forEach(n => tone({ type: 'square', f: mf(n), dur: spb * 0.7, vol: 0.05, t, bus: Snd.music, filt: ['lowpass', 1400, 1] }));

/* =====================================================================
   ART — SVG drawn in code.
   ===================================================================== */
const R1 = n => Math.round(n * 10) / 10;
const stk = (s, sw) => s ? ` stroke="${s}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"` : '';
const E = (cx, cy, rx, ry, f, s, x = '', sw = 4) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${stk(s, sw)} ${x}/>`;
const C = (cx, cy, r, f, s, x = '', sw = 4) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${stk(s, sw)} ${x}/>`;
const P = (d, f, s, x = '', sw = 4) => `<path d="${d}" fill="${f || 'none'}"${stk(s, sw)} ${x}/>`;
const L = (d, s, w, x = '') => `<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const OUT = c => shade(c, -0.36);
const thick = (d, c, w) => L(d, OUT(c), w + 7) + L(d, c, w);
const mirror = s => `<g transform="translate(300 0) scale(-1 1)">${s}</g>`;
function blob(list, c) { return list.map(([x, y, r]) => C(R1(x), R1(y), r + 3.5, OUT(c))).join('') + list.map(([x, y, r]) => C(R1(x), R1(y), r, c)).join(''); }
function fluff(cx, cy, r, pr, c) {
  const n = Math.max(6, Math.ceil(Math.PI / Math.asin(Math.min(0.95, 0.7 * pr / r))));
  const l = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; l.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r, pr]); }
  l.push([cx, cy, r]); return blob(l, c);
}
function starPath(cx, cy, r1, r2 = r1 * 0.45, n = 5) {
  let d = ''; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n; d += (i ? 'L' : 'M') + R1(cx + Math.cos(a) * r) + ' ' + R1(cy + Math.sin(a) * r); }
  return d + 'Z';
}
const star = (x, y, r, f = '#ffd84a', s = '#e0a800') => P(starPath(x, y, r), f, s, '', 2);
const heartPath = (cx, cy, s) => `M${cx} ${cy + s * 0.9} C${cx - s * 1.5} ${cy - s * 0.1} ${cx - s * 0.9} ${cy - s * 1.1} ${cx} ${cy - s * 0.35} C${cx + s * 0.9} ${cy - s * 1.1} ${cx + s * 1.5} ${cy - s * 0.1} ${cx} ${cy + s * 0.9}Z`;
const ol = (shapes, fill, line, w = 7) => `<g fill="${line}" stroke="${line}" stroke-width="${w}" stroke-linejoin="round">${shapes}</g><g fill="${fill}">${shapes}</g>`;

function paws(pc, y = 278, x1 = 116, x2 = 184) { return [x1, x2].map(x => E(x, y, 24, 15, pc, OUT(pc)) + L(`M${x - 7} ${y - 2} v6 M${x + 7} ${y - 2} v6`, OUT(pc), 3)).join(''); }
function stdBody(c, l, o = {}) { const by = o.by || 230, rx = o.rx || 70, ry = o.ry || 56; return E(150, by, rx, ry, c, OUT(c)) + E(150, by + 12, R1(rx * 0.6), R1(ry * 0.62), l) + paws(o.pc || c); }

// ---------- face: sad / okay / happy ----------
function face(f, mood) {
  const cx = 150, ex = f.ex, ey = f.ey, er = f.er, eL = f.eyeLine || '#3a2a3a', mL = f.mouthLine || '#4a2a32';
  let s = '';
  const bx = f.bx || ex + 22, by = f.by || ey + 32, bo = mood === 'happy' ? 0.7 : 0.4;
  s += E(cx - bx, by, 15, 9, '#ff7fa6', null, `opacity="${bo}"`) + E(cx + bx, by, 15, 9, '#ff7fa6', null, `opacity="${bo}"`);
  for (const side of [-1, 1]) {
    const x = cx + side * ex;
    if (mood === 'happy') { s += L(`M${R1(x - er * 0.85)} ${ey + 4} Q${x} ${R1(ey - er * 1.15)} ${R1(x + er * 0.85)} ${ey + 4}`, eL, 6); continue; }
    const y = ey + (mood === 'sad' ? 2 : 0);
    if (f.iris) { s += E(x, y, R1(er * 0.9), er, f.iris, '#1d1720', '', 2.5) + E(x, y + 1, R1(er * 0.5), R1(er * 0.7), '#1d1720'); }
    else s += E(x, y, R1(er * 0.86), er, '#2b2030');
    const hr = mood === 'sad' ? 0.42 : 0.33;
    s += C(R1(x + er * 0.3), R1(y - er * 0.38), R1(er * hr), '#fff') + C(R1(x - er * 0.32), R1(y + er * 0.38), R1(er * 0.15), '#fff');
    if (f.lash) s += L(`M${R1(x + side * er * 0.55)} ${R1(y - er * 0.82)} l${side * 7} -7 M${R1(x + side * er * 0.85)} ${R1(y - er * 0.42)} l${side * 9} -3`, eL, 3);
    if (mood === 'sad') {
      s += L(`M${R1(x - er * 0.6)} ${R1(y + er * 0.75)} Q${x} ${R1(y + er * 1.05)} ${R1(x + er * 0.6)} ${R1(y + er * 0.75)}`, '#8fd3ff', 3);
      s += L(`M${R1(x + side * er)} ${y - er - 6} Q${R1(x + side * er * 0.1)} ${y - er - 8} ${R1(x - side * er * 0.8)} ${y - er - 17}`, f.brow || eL, 5);
    }
  }
  const ny = f.ny, my = f.my, nose = f.nose;
  if (nose === 'dog') s += P(`M${cx - 13} ${ny - 6} Q${cx} ${ny - 10} ${cx + 13} ${ny - 6} Q${cx + 12} ${ny + 8} ${cx} ${ny + 9} Q${cx - 12} ${ny + 8} ${cx - 13} ${ny - 6}Z`, '#3b2a2a') + E(cx - 4, ny - 3, 4, 2.5, '#fff', null, 'opacity=".7"');
  else if (nose === 'cat' || nose === 'bunny') s += P(`M${cx - 8} ${ny - 4} H${cx + 8} L${cx} ${ny + 5}Z`, '#ff8fab', '#c45a79', '', 2.5);
  else if (nose === 'tiny') s += E(cx, ny, 6, 4.5, '#ff8fab', '#c45a79', '', 2);
  else if (nose === 'pig') s += E(cx, ny, 30, 21, '#f590af', '#c9607f', '', 3) + E(cx - 10, ny, 5, 8, '#b84a6b') + E(cx + 10, ny, 5, 8, '#b84a6b');
  else if (nose === 'horse') s += E(cx - 15, ny, 5, 7, '#7a4a2e') + E(cx + 15, ny, 5, 7, '#7a4a2e');
  else if (nose === 'dots') s += C(cx - 6, ny, 2.5, '#3a5a2a') + C(cx + 6, ny, 2.5, '#3a5a2a');
  else if (nose === 'button') s += L(`M${cx - 5} ${ny} Q${cx} ${ny + 5} ${cx + 5} ${ny}`, '#d99a80', 3);
  if (f.mouth === 'bill') {
    if (mood === 'happy') s += P(`M${cx - 22} ${ny + 6} Q${cx} ${ny + 32} ${cx + 22} ${ny + 6}Z`, '#8a2d3b', '#d9731b', '', 3) + E(cx, ny + 16, 7, 5, '#ff7b95');
    else s += E(cx, ny + 11, 22, 7, '#f08a30', '#d9731b', '', 3);
    s += E(cx, ny, 30, 12, '#ff9f43', '#d9731b', '', 3) + C(cx - 8, ny - 3, 2, '#b85a10') + C(cx + 8, ny - 3, 2, '#b85a10');
  } else if (f.mouth === 'beak2') {
    if (mood === 'happy') s += P(`M${cx - 12} ${ny + 2} L${cx} ${ny + 22} L${cx + 12} ${ny + 2}Z`, '#8a2d3b') + P(`M${cx - 11} ${ny + 12} L${cx} ${ny + 28} L${cx + 11} ${ny + 12}Z`, '#ffa64d', '#d9731b', '', 2.5);
    s += P(`M${cx - 14} ${ny - 4} L${cx} ${ny + 14} L${cx + 14} ${ny - 4} Q${cx} ${ny - 10} ${cx - 14} ${ny - 4}Z`, '#ffb347', '#d9731b', '', 3);
  } else if (f.mouth === 'beak') {
    if (mood === 'happy') s += P(`M${cx - 14} ${ny + 8} Q${cx} ${ny + 34} ${cx + 14} ${ny + 8}Z`, '#8a2d3b', '#c9901a', '', 3) + E(cx, ny + 20, 6, 5, '#ff7b95') + P(`M${cx - 14} ${ny + 18} Q${cx} ${ny + 38} ${cx + 14} ${ny + 18} Q${cx} ${ny + 28} ${cx - 14} ${ny + 18}Z`, '#f0a92a', '#c9901a', '', 3);
    else s += E(cx, ny + 16, 13, 7, '#f0a92a', '#c9901a', '', 3);
    s += P(`M${cx - 21} ${ny - 12} Q${cx} ${ny - 22} ${cx + 21} ${ny - 12} Q${cx + 18} ${ny + 16} ${cx} ${ny + 22} Q${cx - 8} ${ny + 8} ${cx - 21} ${ny - 12}Z`, '#ffcf3f', '#c9901a', '', 3);
  } else {
    const animalMouth = nose === 'dog' || nose === 'cat' || nose === 'bunny' || nose === 'tiny';
    if (animalMouth && mood !== 'happy') s += L(`M${cx} ${ny + 7} V${my}`, mL, 3.5);
    if (mood === 'sad') s += L(`M${cx - 15} ${my + 9} Q${cx} ${my - 5} ${cx + 15} ${my + 9}`, mL, 4.5);
    else if (mood === 'okay') s += animalMouth ? L(`M${cx - 16} ${my - 1} Q${cx - 8} ${my + 9} ${cx} ${my} Q${cx + 8} ${my + 9} ${cx + 16} ${my - 1}`, mL, 4) : L(`M${cx - 14} ${my} Q${cx} ${my + 12} ${cx + 14} ${my}`, mL, 4.5);
    else s += P(`M${cx - 21} ${my - 2} Q${cx} ${my + 36} ${cx + 21} ${my - 2} Q${cx} ${my + 5} ${cx - 21} ${my - 2}Z`, '#8a2d3b', mL, '', 3.5) + E(cx, my + 14, 9, 7, '#ff7b95');
    if (f.teeth && mood !== 'happy') s += P(`M${cx - 7} ${my + 1} h14 v9 q0 3 -3 3 h-8 q-3 0 -3 -3Z`, '#fff', mL, '', 2.5) + L(`M${cx} ${my + 1} v12`, mL, 2);
  }
  if (f.freckles) s += [[-1, 0], [-1, 1], [-1, 2], [1, 0], [1, 1], [1, 2]].map(([sd, i]) => C(R1(cx + sd * (bx - 8 + i * 8)), R1(by - 8 + (i % 2) * 6), 1.8, '#d9895a')).join('');
  if (f.whisk) s += L('M110 154 L70 146 M110 162 L68 164 M190 154 L230 146 M190 162 L232 164', f.whiskColor || '#8a6a5a', 2.5);
  return s;
}

function buntingSVG(w, hh) {
  const cols = ['#ff8fb1', '#ffd166', '#8ee3c8', '#7cc6fe', '#b79cff'];
  let s = '', k = 0; const sag = hh * 0.45, fh = hh * 0.5;
  const swoops = Math.max(2, Math.round(w / 520));
  for (let i = 0; i < swoops; i++) {
    const x0 = i * w / swoops, x1 = (i + 1) * w / swoops, mx = (x0 + x1) / 2;
    s += `<path d="M${R1(x0)} 6 Q${R1(mx)} ${R1(6 + sag * 2)} ${R1(x1)} 6" stroke="#c78bb0" stroke-width="3" fill="none"/>`;
    const n = Math.max(4, Math.round((x1 - x0) / 70));
    for (let j = 1; j < n; j++) {
      const t = j / n, x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1, y = (1 - t) * (1 - t) * 6 + 2 * (1 - t) * t * (6 + sag * 2) + t * t * 6;
      const hw = Math.min(22, (x1 - x0) / n * 0.38);

    }
  }
  return `<svg viewBox="0 0 ${R1(w)} ${R1(hh)}" overflow="visible" preserveAspectRatio="xMidYMin meet">${s}</svg>`;
}

/* =====================================================================

   ===================================================================== */
const stage = $('#stage');
let W = 1200, H = 800, SC = 1, SX = 0, SY = 0;
const isPortrait = () => H / W >= 1.4;
const floorLine = () => Math.round(H * (isPortrait() ? 0.55 : 0.62));
const decoK = () => Math.max(0.72, Math.min(1.1, W / 1200));
const toClient = (x, y) => [SX + x * SC, SY + y * SC];
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, a = vw / vh;
  if (a >= 1) { H = 800; W = Math.round(Math.min(1700, Math.max(800, 800 * a))); }
  else { W = 800; H = Math.round(Math.min(1700, Math.max(800, 800 / a))); }
  SC = Math.min(vw / W, vh / H); SX = (vw - W * SC) / 2; SY = (vh - H * SC) / 2;
  Object.assign(stage.style, { width: W + 'px', height: H + 'px', transform: `scale(${SC})`, left: SX + 'px', top: SY + 'px' });
  FX.resize();
  if (cur && screens[cur].layout) screens[cur].layout();
}

const FX = {

  crumbs(x, y, n = 10, color = '#d9a066') { for (let i = 0; i < n; i++) { const a = rand(3.4, 6.0), s = rand(2, 6) * SC; this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0.3 * SC, life: 0, max: 40, size: rand(6, 11) * SC, color, shape: 'circle', rot: 0, vr: 0, drag: 0.98 }); } },
  confetti(n = 150) { for (let i = 0; i < n; i++) this.add({ x: rand(0, innerWidth), y: rand(-innerHeight * 0.4, -10), vx: rand(-2, 2) * SC, vy: rand(3, 8) * SC, g: 0.06 * SC, life: 0, max: rand(150, 260), size: rand(12, 22) * SC, color: pick(this.cols), shape: pick(['rect', 'rect', 'circle', 'star']), rot: rand(0, 6), vr: rand(-0.25, 0.25), sway: rand(0, 6), drag: 0.985 }); },
  tick() {

    this.ps = this.ps.filter(p => {
      p.life++; p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.x += p.vx + (p.sway ? Math.sin(p.life * 0.1 + p.sway) * 1.2 * SC : 0); p.y += p.vy; p.rot += p.vr;
      if (p.life > p.max || p.y > innerHeight + 60) return false;
      const a = Math.min(1, 1 - (p.life - p.max * 0.7) / (p.max * 0.3));
      c.save(); c.globalAlpha = Math.max(0, a); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color; const s = p.size;

/* =====================================================================
   A DAY AT THE CLINIC
   ===================================================================== */
let day = null;
function newDay() {
  const others = ['puppy', 'bigdog', 'dachshund', 'poodle', 'fox', 'kitten', 'bunny', 'hamster', 'guineapig', 'turtle', 'lamb', 'duckling', 'parrot', 'penguin', 'pony', 'piglet', 'panda'];
  const bag = []; others.forEach(s => { bag.push(s); if (!save.stickers[s]) bag.push(s); });
  const chosen = []; while (chosen.length < 5) { const s = pick(bag); if (!chosen.includes(s)) chosen.push(s); }
  if (Math.random() < 0.15) chosen[4] = 'unicorn';
  else if (Math.random() < 0.12) chosen[4] = 'dragon';
  if (Math.random() < 0.5) chosen[3] = 'shiloh';          // little sister drops in about every other day
  shuffle(chosen).forEach((s, i) => { chosen[i] = s; });
  chosen.splice(Math.floor(Math.random() * 6), 0, 'coco');
  const probs = shuffle(Object.keys(PROBLEMS)).slice(0, 6);
  const si = chosen.indexOf('shiloh');                     // a dog biscuit is no snack for Shiloh
  if (si >= 0 && probs[si] === 'hungry') { const j = (si + 1) % 6; [probs[si], probs[j]] = [probs[j], probs[si]]; }
  day = { patients: chosen.map((sp, i) => ({ sp, prob: probs[i], done: false })), next: 0, starsToday: 0 };
  day.theme = Math.random() < 0.3 ? pick(['birthday', 'snow', 'night']) : null;   // special days
  if (Math.random() < 0.4) {                                                       // an ambulance brings someone with two problems
    const p = pick(day.patients.filter(q => q.sp !== 'coco')), at1 = PROBLEMS[p.prob].at;
    p.amb = true; p.prob2 = pick(Object.keys(PROBLEMS).filter(k => k !== p.prob && PROBLEMS[k].at !== at1 && !(SP[p.sp].human && k === 'hungry')));
  }
}

/* =====================================================================
   WALKING PETS — bought in the shop, they wander the clinic floor.
   ===================================================================== */
function walkPets(layer, ids, z) {
  const g = gen; layer.innerHTML = '';
  const pets = ids.map((sp, i) => {
    const y = ids.length > 1 ? z.y0 + (z.y1 - z.y0) * i / (ids.length - 1) : z.y1;
    const el = h(`<div class="pt pet" style="z-index:${Math.round(y)}"><div class="flip"><div class="mv"><div class="md idle" style="animation-delay:${rand(-2, 0).toFixed(2)}s"><div class="rx">${animalSVG(sp, 'happy')}</div></div></div></div></div>`);
    layer.appendChild(el);
    const p = { sp, el, flip: $('.flip', el), md: $('.md', el), x: rand(z.x0, z.x1), tx: 0, wait: rand(0.3, 2.5), speed: rand(55, 85) };
    place(el, p.x - z.size / 2, y - z.size * 0.95, z.size, z.size);
    el.addEventListener('pointerdown', () => { if (z.onTap) { z.onTap(sp); return; } speak(sp, el); hop(el); FX.hearts(...elCenter(el), 5); p.wait = 1.2; p.md.className = 'md idle'; });
    return p;
  });
  let last = performance.now();
  const step = t => {
    if (g !== gen || !layer.isConnected || layer.childElementCount !== pets.length || (pets[0] && !pets[0].el.isConnected)) return;
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    for (const p of pets) {
      if (p.wait > 0) {
        p.wait -= dt;
        if (p.wait <= 0) { p.tx = rand(z.x0, z.x1); p.md.className = 'md walk'; p.flip.classList.toggle('left', p.tx < p.x); }
        continue;
      }
      const d = p.tx - p.x, s = p.speed * dt;
      if (Math.abs(d) <= s) { p.x = p.tx; p.wait = rand(1.5, 4.5); p.md.className = 'md idle'; } else p.x += Math.sign(d) * s;
      p.el.style.left = R1(p.x - z.size / 2) + 'px';
    }
    requestAnimationFrame(step);
  };
  if (pets.length) requestAnimationFrame(step);
}

   ===================================================================== */
const SHOP_PETS = [['hamster', 30], ['duckling', 30], ['turtle', 30], ['guineapig', 35], ['puppy', 40], ['kitten', 40], ['bunny', 40], ['lamb', 45], ['piglet', 50],
  ['fox', 60], ['penguin', 70], ['panda', 80], ['unicorn', 150], ['dragon', 150]].map(([sp, cost]) => ({ key: 'pet:' + sp, kind: 'pet', sp, cost }));
const SHOP_DECOS = () => DECOS.slice().sort((a, b) => a.cost - b.cost).map(d => ({ key: 'deco:' + d.id, kind: 'deco', d, cost: d.cost }));
const SHOP_WEAR = WEAR_IDS.map(id => ({ key: 'wear:' + id, kind: 'wear', id, cost: WEAR[id].cost })).sort((a, b) => a.cost - b.cost);
const shopOwned = it => it.kind === 'pet' ? save.pets.includes(it.sp) : it.kind === 'wear' ? !!save.owned[it.id] : !!save.owned[it.d.id];
const shopPic = it => it.kind === 'pet' ? animalSVG(it.sp, 'happy') : it.kind === 'wear' ? animalSVG('puppy', 'happy', null, 0, { wear: it.id }) : it.d.svg(140, 120);
screens.shop = {
  enter(el, tab) {
    this.el = el; this.tab = tab || 'pets';
    el.innerHTML = `<div class="shop-bg"></div><div class="awning"></div><div class="shop-sign">Shop</div>
      <div class="topbar"><button class="icon-btn" id="sBack" style="left:16px;top:16px" aria-label="My Clinic">${ICON.house}</button><div class="tr">${starPill()}</div></div>
      <div class="tabs"><button class="tab" data-tab="pets" aria-label="Pets">${ICON.paw}</button><button class="tab" data-tab="deco" aria-label="Decorations">${ICON.home.replace(/#fff/g, '#b79cff')}</button><button class="tab" data-tab="wear" aria-label="Dress-up">${ICON.bow}</button></div>
      <div class="sgrid"></div>`;
    $('#sBack', el).addEventListener('click', () => { SFX.pop(); go('room'); });
    $$('.tab', el).forEach(t => t.addEventListener('click', () => { SFX.pop(); this.tab = t.dataset.tab; this.render(); }));
    this.render();
  },
  items() { return this.tab === 'pets' ? SHOP_PETS : this.tab === 'wear' ? SHOP_WEAR : SHOP_DECOS(); },
  render() {
    const el = this.el;
    $$('.tab', el).forEach(t => t.classList.toggle('on', t.dataset.tab === this.tab));
    const g = $('.sgrid', el);
    g.innerHTML = this.items().map(it => { const own = shopOwned(it);
      return `<div class="card ${own ? 'owned' : save.stars < it.cost ? 'poor' : ''}" data-k="${it.key}"><div class="pic">${shopPic(it)}</div>${own ? `<div class="got">${ICON.check}</div>` : `<div class="price">${ICON.star}<b>${it.cost}</b></div>`}</div>`; }).join('');
    $$('.card', g).forEach(c => c.addEventListener('click', () => this.tap(c)));
    $('.pill.stars b', el).textContent = save.stars;
  },
  tap(c) {
    const it = this.items().find(i => i.key === c.dataset.k); if (!it) return;
    const bounce = cls => { c.classList.remove('shake', 'hopit'); void c.offsetWidth; c.classList.add(cls); };
    if (shopOwned(it)) { bounce('hopit'); if (it.kind === 'pet') SP[it.sp].sound(); else SFX.chime(); return; }
    if (save.stars < it.cost) { bounce('shake'); SFX.boop(); return; }
    SFX.pop();
    const ov = h(`<div class="overlay"><div class="buy"><div class="big">${shopPic(it)}</div><div class="row"><button class="icon-btn no" aria-label="No">${ICON.x}</button><button class="yes" aria-label="Buy">${ICON.star}<b>${it.cost}</b></button></div></div></div>`);
    stage.appendChild(ov);
    if (it.kind === 'pet') SP[it.sp].sound();
    $('.no', ov).addEventListener('click', () => { SFX.pop(); ov.remove(); });
    ov.addEventListener('pointerdown', e => { if (e.target === ov) ov.remove(); });
    $('.yes', ov).addEventListener('click', () => {
      if (save.stars < it.cost || shopOwned(it)) { ov.remove(); return; }
      save.stars -= it.cost;
      if (it.kind === 'pet') save.pets.push(it.sp); else save.owned[it.kind === 'wear' ? it.id : it.d.id] = true;
      store(); ov.remove(); SFX.coin(); setTimeout(() => SFX.cheer(), 250); FX.confetti(90);
      this.render();
      const nc = $(`.card[data-k="${it.key}"]`, this.el);
      if (nc) { nc.classList.add('hopit'); FX.sparkle(...elCenter(nc), 24); }
      if (it.kind === 'pet') setTimeout(() => SP[it.sp].sound(), 600);
    });
  }
};

/* =====================================================================
   START
   ===================================================================== */
load(); FX.init(); drawMute();
$('#mute').addEventListener('click', () => { Snd.init(); Music.start(); Snd.setMuted(!save.muted); });
// Audio may only start after a touch; unlock on the first one anywhere.
const unlock = () => { Snd.init(); Music.start(); };
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlock, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else Snd.ctx.resume(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('animationend', e => { if (e.animationName === 'popIn' && e.target.classList.contains('big-play')) e.target.classList.remove('pop-in'); });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();
go('title');
</script>
</body>
</html>
